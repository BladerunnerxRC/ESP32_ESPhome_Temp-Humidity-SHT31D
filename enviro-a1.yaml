# ESPhome configuration for the ENVIRO-A1 ESP32 board.
#
# Works with INFO ESPHome 2026.4.2 firmware for hardware:
#   - ESP32-D0WDQ6 (revision v1.0)
#   - Features: WiFi, BT, Dual Core, Coding Scheme None
#   - 40MHz crystal
#   - 4MB flash
#
# -------------------------------
# GPIO Pin Assignments Table
# -------------------------------
# | Function                | GPIO Pin | Notes                        |
# |-------------------------|----------|------------------------------|
# | I2C SDA                 | GPIO21   | Data line for I2C bus        |
# | I2C SCL                 | GPIO22   | Clock line for I2C bus       |
# | Onboard LED (WiFi LED)  | GPIO2    | Controls onboard status LED  |
# -------------------------------

substitutions:
  # Default calibration offsets applied to the SHT31D readings
  temperature_calibration: "-5.7"
  humidity_calibration: "5.4"
  # Default measurement intervals in seconds
  update_interval_s: "30"
  update_interval_wifi: "60"

esphome:
  name: "enviro-a1"
  friendly_name: ENVIRO-A1
  # Re-apply the restored update intervals to the pollers after boot,
  # since restore_value only restores the number states, not the pollers.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (!isnan(id(update_interval_seconds_number).state)) {
            id(sht31d_component).set_update_interval((uint32_t) (id(update_interval_seconds_number).state * 1000));
            id(sht31d_component).stop_poller();
            id(sht31d_component).start_poller();
          }
          if (!isnan(id(update_interval_wifi_seconds_number).state)) {
            id(wifi_signal_sensor).set_update_interval((uint32_t) (id(update_interval_wifi_seconds_number).state * 1000));
            id(wifi_signal_sensor).stop_poller();
            id(wifi_signal_sensor).start_poller();
          }

esp32:
  board: esp32dev
  framework:
    type: esp-idf # Default framework since ESPHome 2025.2

# Configure I2C bus for the SHT31D sensor
i2c:
  id: bus_a
  sda: 21
  scl: 22
  scan: true

# Enable detailed logging. UART output is disabled when baud_rate=0.
logger:
  level: DEBUG # Options: ERROR, WARN, INFO, DEBUG, VERY_VERBOSE
  baud_rate: 115200 # enable UART logging for debugging
  # baud_rate: 0 # disable UART logging

# Enable the Home Assistant API with encrypted communication
api:
  encryption:
    key: !secret enviro_a1_api_key

# Over-the-air update credentials
ota:
  - platform: esphome
    password: !secret enviro_a1_api_key

# Reboot into safe mode if boot loops are detected so OTA stays reachable
safe_mode:

# Use Home Assistant as the time source
time:
  - platform: homeassistant
    id: ha_time

wifi:
  # Wi-Fi credentials
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 15.5dB
  # Static network configuration
  manual_ip:
    static_ip: 10.100.50.16
    gateway: 10.100.50.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 8.8.4.4

  # Turn on the LED when connected and log in the console
  on_connect:
    then:
      - switch.turn_on:
          id: onboard_led
      - logger.log: "WiFi connected"
      - homeassistant.action:
          action: persistent_notification.create
          data:
            title: "ENVIRO-A1"
            message: "WiFi connection established"

  # Handle disconnection: wait 30s, then only restart if still offline
  on_disconnect:
    then:
      - switch.turn_off:
          id: onboard_led
      - logger.log: "WiFi disconnected. Waiting 30 seconds before restart."
      - delay: 30s
      - if:
          condition:
            wifi.connected: {}
          then:
            - logger.log: "WiFi reconnected during delay, not restarting."
          else:
            - logger.log: "Still disconnected, restarting now."
            - switch.turn_on:
                id: reboot_enviro_a1_restart

  # Fallback access point settings for when Wi-Fi is not available
  ap:
    ssid: !secret enviro_a1_ap_sid
    password: !secret enviro_a1_ap_pwd

# Serve a setup page when the fallback AP is active
captive_portal:

sensor:
  # Report Wi-Fi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: ${update_interval_wifi}s
    entity_category: diagnostic

  # SHT31D temperature/humidity sensor (I2C)
  - platform: sht3xd
    id: sht31d_component
    i2c_id: bus_a # Use defined I2C bus
    address: 0x44 # Default I2C address for SHT31D
    heater_enabled: false # Keep the internal heater off so it doesn't skew readings
    temperature:
      name: "SHT31_Temperature" # Temperature sensor entity
      id: temp
      filters:
        - lambda: |-
            if (isnan(id(temperature_calibration_number).state)) return x;
            return x + id(temperature_calibration_number).state;
    humidity:
      name: "Humidity" # Humidity sensor entity
      id: humidity
      filters:
        - lambda: |-
            if (isnan(id(humidity_calibration_number).state)) return x;
            return x + id(humidity_calibration_number).state;
    update_interval: ${update_interval_s}s

  # How long the device has been running
  - platform: uptime
    id: enviro_a1_uptime_sensor
    name: "ENVIRO-A1 Uptime"
    entity_category: diagnostic

binary_sensor:
  # Show if the device is online
  - platform: status
    name: "Connection Status"
    id: connection_status
    entity_category: diagnostic

  # Trigger a reboot from Home Assistant when the input_boolean is toggled
  - platform: homeassistant
    name: "Reboot ENVIRO-A1 Trigger"
    entity_id: input_boolean.reboot_enviro_a1
    id: reboot_trigger
    on_press:
      - if:
          # Prevent reboot during first 60 seconds after boot (debounce)
          condition:
            lambda: 'return millis() > 60000;'
          then:
            - logger.log: "Manual reboot requested via Home Assistant"
            # Turn off the HA boolean so it resets for next use
            - homeassistant.action:
                action: input_boolean.turn_off
                data:
                  entity_id: input_boolean.reboot_enviro_a1
            - logger.log: "Device rebooting now"
            - switch.turn_on:
                id: reboot_enviro_a1_restart
          else:
            - logger.log: "Debounce blocked reboot: uptime too short"
            - homeassistant.action:
                action: input_boolean.turn_off
                data:
                  entity_id: input_boolean.reboot_enviro_a1

switch:
  # Controls the onboard LED connected to GPIO2 (WiFi status indicator)
  - platform: gpio
    name: "Wifi Connect LED Switch"
    pin: 2
    id: onboard_led
    inverted: false

  # Exposes a restart switch to Home Assistant
  - platform: restart
    name: "Reboot_ENVIRO-A1"
    id: reboot_enviro_a1_restart

button:
  - platform: template
    name: "Refresh Sensors"
    id: refresh_sensors
    on_press:
      - component.update: sht31d_component
      - component.update: wifi_signal_sensor
      - component.update: enviro_a1_uptime_sensor

number:
  # Calibration offsets are read directly by the sensor filters above,
  # so a new value takes effect on the next measurement.
  - platform: template
    name: "Temperature Calibration"
    id: temperature_calibration_number
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${temperature_calibration}
    set_action:
      - button.press: refresh_sensors

  - platform: template
    name: "Humidity Calibration"
    id: humidity_calibration_number
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "%"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${humidity_calibration}
    set_action:
      - button.press: refresh_sensors

  # Interval changes are applied to the pollers immediately.
  - platform: template
    name: "Update Interval (s)"
    id: update_interval_seconds_number
    min_value: 10
    max_value: 3600
    step: 1
    unit_of_measurement: "s"
    mode: box
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${update_interval_s}
    set_action:
      - lambda: |-
          id(sht31d_component).set_update_interval((uint32_t) (x * 1000));
          id(sht31d_component).stop_poller();
          id(sht31d_component).start_poller();

  - platform: template
    name: "WiFi Update Interval (s)"
    id: update_interval_wifi_seconds_number
    min_value: 10
    max_value: 3600
    step: 1
    unit_of_measurement: "s"
    mode: box
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${update_interval_wifi}
    set_action:
      - lambda: |-
          id(wifi_signal_sensor).set_update_interval((uint32_t) (x * 1000));
          id(wifi_signal_sensor).stop_poller();
          id(wifi_signal_sensor).start_poller();
